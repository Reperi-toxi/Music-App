<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title></title>

</head>

<body>

  <div class="remote">
    <h1 id="title">{{song_name}}</h1>

    <button class="main" onclick="cmd('/play')">▶ / ⏸</button>

    <div class="controls">
      <button onclick="cmd('/stop')">⏹</button>
    </div>

    <div class="controls">
      <button class="small" onclick="cmd('/prev')">⏮</button>
      <button class="small" onclick="cmd('/next')">⏭</button>
    </div>

    <div class="controls">
      <button class="small" onclick="cmd('/back')">-5s</button>
      <button class="small" onclick="cmd('/fwd')">+5s</button>
    </div>
  </div>

  <script>
    let lastName = "";

    async function updateSong() {
      const r = await fetch('/song');
      const d = await r.json();

      if (d.name !== lastName) {
        document.getElementById('title').textContent = d.name;
        lastName = d.name;
      }
    }

    async function cmd(action) {
      await fetch(action);
      await updateSong();
    }

    setInterval(updateSong, 1000);
  </script>

</body>
</html>
